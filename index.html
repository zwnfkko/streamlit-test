    "value":  "import streamlit as st\n\nst.set_page_config(\n    page_title=\"이지원 | 자기소개\",\n    page_icon=\"🌸\",\n    layout=\"wide\",\n    initial_sidebar_state=\"expanded\",\n)\n\n# CSS 커스텀 스타일\nst.markdown(\"\"\"\n\u003cstyle\u003e\n    .profile-header {\n        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);\n        padding: 2rem;\n        border-radius: 12px;\n        color: white;\n        text-align: center;\n        margin-bottom: 2rem;\n    }\n    .profile-name {\n        font-size: 2.5rem;\n        font-weight: 700;\n        margin: 0;\n    }\n    .profile-title {\n        font-size: 1.2rem;\n        opacity: 0.9;\n        margin-top: 0.5rem;\n    }\n    .section-card {\n        background: #fff5f7;\n        border-left: 4px solid #f5576c;\n        padding: 1rem 1.5rem;\n        border-radius: 0 8px 8px 0;\n        margin-bottom: 1rem;\n    }\n    .avatar-wrap img {\n        border-radius: 50%;\n        border: 4px solid #f5576c;\n        box-shadow: 0 4px 16px rgba(245,87,108,0.25);\n    }\n    .skill-tag {\n        display: inline-block;\n        background: #f5576c;\n        color: white;\n        padding: 0.3rem 0.8rem;\n        border-radius: 20px;\n        font-size: 0.85rem;\n        margin: 0.2rem;\n    }\n    .contact-item {\n        font-size: 1rem;\n        padding: 0.4rem 0;\n    }\n\u003c/style\u003e\n\"\"\", unsafe_allow_html=True)\n\n# ── 사이드바 ──────────────────────────────────────────\nwith st.sidebar:\n    st.markdown(\u0027\u003cdiv class=\"avatar-wrap\"\u003e\u0027, unsafe_allow_html=True)\n    st.image(\"https://api.dicebear.com/7.x/adventurer/svg?seed=Jiwon\u0026backgroundColor=ffd5dc\u0026hair=long16\u0026hairColor=6a4e35\u0026eyes=variant12\u0026eyebrows=variant08\u0026mouth=variant04\u0026skinColor=f9c9b6\", width=160)\n    st.markdown(\u0027\u003c/div\u003e\u0027, unsafe_allow_html=True)\n    st.markdown(\"### 이지원 🌸\")\n    st.markdown(\"**풀스택 개발자**\")\n    st.divider()\n    st.markdown(\"#### 연락처\")\n    st.markdown(\"📧 zwnfkko@gmail.com\")\n    st.markdown(\"📱 010-1234-5678\")\n    st.markdown(\"🐱 [github.com/zwnfkko](https://github.com/zwnfkko)\")\n    st.divider()\n    menu = st.radio(\"페이지 이동\", [\"🏠 홈\", \"💼 경력\", \"🛠️ 기술스택\", \"📂 프로젝트\", \"📬 연락하기\"])\n\n# ── 메인 헤더 ──────────────────────────────────────────\nst.markdown(\"\"\"\n\u003cdiv class=\"profile-header\"\u003e\n    \u003cp class=\"profile-name\"\u003e안녕하세요, 이지원입니다 🌸\u003c/p\u003e\n    \u003cp class=\"profile-title\"\u003e풀스택 개발자 · 데이터 분석가 · 문제 해결사\u003c/p\u003e\n\u003c/div\u003e\n\"\"\", unsafe_allow_html=True)\n\n# ── 홈 ────────────────────────────────────────────────\nif menu == \"🏠 홈\":\n    col1, col2, col3, col4 = st.columns(4)\n    col1.metric(\"경력\", \"3년\", \"신입→주니어\")\n    col2.metric(\"완료 프로젝트\", \"12개\", \"+3 올해\")\n    col3.metric(\"사용 언어\", \"5가지\", \"Python, JS 외\")\n    col4.metric(\"자격증\", \"3개\", \"최근 취득\")\n\n    st.divider()\n\n    col_left, col_right = st.columns([2, 1])\n\n    with col_left:\n        st.subheader(\"👤 소개\")\n        st.markdown(\"\"\"\n        \u003cdiv class=\"section-card\"\u003e\n        안녕하세요! 저는 \u003cstrong\u003e이지원\u003c/strong\u003e입니다.\u003cbr\u003e\u003cbr\u003e\n        사용자 경험을 최우선으로 생각하는 \u003cstrong\u003e풀스택 개발자\u003c/strong\u003e로,\n        백엔드부터 프론트엔드, 데이터 분석까지 폭넓게 다룹니다.\u003cbr\u003e\u003cbr\u003e\n        새로운 기술을 빠르게 습득하고 팀과 협력하여 문제를 해결하는 것을 즐깁니다.\n        \u003c/div\u003e\n        \"\"\", unsafe_allow_html=True)\n\n        st.subheader(\"🎓 학력\")\n        st.markdown(\"\"\"\n        | 기간 | 학교 | 전공 | 학위 |\n        |------|------|------|------|\n        | 2018 – 2022 | ○○대학교 | 컴퓨터공학과 | 학사 |\n        | 2022 – 2024 | ○○대학원 | 소프트웨어공학 | 석사 |\n        \"\"\")\n\n    with col_right:\n        st.subheader(\"🌟 핵심 역량\")\n        competencies = {\n            \"문제 해결력\": 90,\n            \"커뮤니케이션\": 85,\n            \"팀워크\": 95,\n            \"자기 학습\": 88,\n            \"창의성\": 80,\n        }\n        for skill, score in competencies.items():\n            st.markdown(f\"**{skill}**\")\n            st.progress(score / 100)\n\n# ── 경력 ──────────────────────────────────────────────\nelif menu == \"💼 경력\":\n    st.subheader(\"💼 경력 사항\")\n\n    experiences = [\n        {\n            \"period\": \"2024.03 – 현재\",\n            \"company\": \"(주) ABC테크\",\n            \"role\": \"백엔드 개발자\",\n            \"desc\": \"FastAPI 기반 RESTful API 설계 및 개발, PostgreSQL DB 최적화, CI/CD 파이프라인 구축\",\n            \"tags\": [\"Python\", \"FastAPI\", \"PostgreSQL\", \"Docker\", \"AWS\"],\n        },\n        {\n            \"period\": \"2022.07 – 2024.02\",\n            \"company\": \"(주) DEF솔루션\",\n            \"role\": \"풀스택 개발자\",\n            \"desc\": \"React + Django 기반 사내 ERP 시스템 개발, 데이터 시각화 대시보드 구축\",\n            \"tags\": [\"React\", \"Django\", \"MySQL\", \"Chart.js\"],\n        },\n        {\n            \"period\": \"2021.01 – 2022.06\",\n            \"company\": \"GHI스타트업\",\n            \"role\": \"인턴 개발자\",\n            \"desc\": \"Python 데이터 파이프라인 개발, Streamlit 대시보드 프로토타이핑\",\n            \"tags\": [\"Python\", \"Pandas\", \"Streamlit\"],\n        },\n    ]\n\n    for exp in experiences:\n        with st.expander(f\"**{exp[\u0027period\u0027]}** | {exp[\u0027company\u0027]} — {exp[\u0027role\u0027]}\", expanded=True):\n            st.markdown(f\"**역할:** {exp[\u0027role\u0027]}\")\n            st.markdown(f\"**기간:** {exp[\u0027period\u0027]}\")\n            st.markdown(f\"**주요 업무:** {exp[\u0027desc\u0027]}\")\n            tags_html = \" \".join([f\u0027\u003cspan class=\"skill-tag\"\u003e{t}\u003c/span\u003e\u0027 for t in exp[\"tags\"]])\n            st.markdown(f\"**사용 기술:** {tags_html}\", unsafe_allow_html=True)\n\n# ── 기술스택 ───────────────────────────────────────────\nelif menu == \"🛠️ 기술스택\":\n    st.subheader(\"🛠️ 기술 스택\")\n\n    tab1, tab2, tab3, tab4 = st.tabs([\"🐍 백엔드\", \"🎨 프론트엔드\", \"🗄️ 데이터베이스\", \"⚙️ DevOps\"])\n\n    with tab1:\n        col1, col2 = st.columns(2)\n        with col1:\n            skills = {\"Python\": 90, \"FastAPI\": 80, \"Django\": 75, \"Node.js\": 65}\n            for s, v in skills.items():\n                st.markdown(f\"**{s}**\")\n                st.progress(v / 100)\n                st.caption(f\"{v}%\")\n        with col2:\n            st.markdown(\"**주요 라이브러리**\")\n            libs = [\"Pandas\", \"NumPy\", \"SQLAlchemy\", \"Pydantic\", \"Celery\", \"Streamlit\"]\n            for l in libs:\n                st.markdown(f\"- `{l}`\")\n\n    with tab2:\n        col1, col2 = st.columns(2)\n        with col1:\n            skills = {\"React\": 80, \"TypeScript\": 70, \"HTML/CSS\": 85, \"Vue.js\": 55}\n            for s, v in skills.items():\n                st.markdown(f\"**{s}**\")\n                st.progress(v / 100)\n                st.caption(f\"{v}%\")\n        with col2:\n            st.markdown(\"**주요 라이브러리**\")\n            libs = [\"Redux\", \"Tailwind CSS\", \"Chart.js\", \"Axios\"]\n            for l in libs:\n                st.markdown(f\"- `{l}`\")\n\n    with tab3:\n        skills = {\"PostgreSQL\": 85, \"MySQL\": 80, \"MongoDB\": 65, \"Redis\": 60}\n        for s, v in skills.items():\n            col1, col2 = st.columns([3, 1])\n            col1.progress(v / 100, text=s)\n            col2.markdown(f\"**{v}%**\")\n\n    with tab4:\n        col1, col2 = st.columns(2)\n        with col1:\n            skills = {\"Docker\": 75, \"AWS\": 65, \"Linux\": 80, \"Git\": 90}\n            for s, v in skills.items():\n                st.markdown(f\"**{s}**\")\n                st.progress(v / 100)\n        with col2:\n            st.markdown(\"**자격증**\")\n            st.success(\"✅ AWS Solutions Architect Associate\")\n            st.success(\"✅ 정보처리기사\")\n            st.info(\"🔄 CKAD (취득 준비 중)\")\n\n# ── 프로젝트 ───────────────────────────────────────────\nelif menu == \"📂 프로젝트\":\n    st.subheader(\"📂 주요 프로젝트\")\n\n    projects = [\n        {\n            \"title\": \"실시간 주식 대시보드\",\n            \"period\": \"2024.06 – 2024.09\",\n            \"desc\": \"WebSocket으로 실시간 주가 데이터를 수신하여 Streamlit으로 시각화하는 대시보드. 포트폴리오 수익률 분석 기능 포함.\",\n            \"tech\": [\"Python\", \"Streamlit\", \"WebSocket\", \"Plotly\", \"PostgreSQL\"],\n            \"role\": \"개인 프로젝트\",\n            \"highlight\": \"일 평균 200명 사용\",\n        },\n        {\n            \"title\": \"사내 ERP 시스템\",\n            \"period\": \"2023.01 – 2023.12\",\n            \"desc\": \"중소기업용 맞춤형 ERP 시스템. 인사·재무·재고 관리 모듈을 통합하여 업무 효율 40% 향상.\",\n            \"tech\": [\"React\", \"Django\", \"MySQL\", \"Docker\"],\n            \"role\": \"팀 리드 (4인)\",\n            \"highlight\": \"업무 효율 40% 향상\",\n        },\n        {\n            \"title\": \"AI 챗봇 고객센터\",\n            \"period\": \"2024.01 – 2024.04\",\n            \"desc\": \"LLM 기반 고객 응대 챗봇. FAQ 자동 응답 및 상담사 연결 기능 구현. 상담 대기 시간 60% 단축.\",\n            \"tech\": [\"Python\", \"FastAPI\", \"LangChain\", \"Redis\", \"React\"],\n            \"role\": \"백엔드 담당\",\n            \"highlight\": \"대기 시간 60% 단축\",\n        },\n    ]\n\n    for proj in projects:\n        with st.container(border=True):\n            col1, col2 = st.columns([3, 1])\n            with col1:\n                st.markdown(f\"### {proj[\u0027title\u0027]}\")\n                st.caption(f\"📅 {proj[\u0027period\u0027]}  |  👤 {proj[\u0027role\u0027]}\")\n                st.markdown(proj[\"desc\"])\n                tags_html = \" \".join([f\u0027\u003cspan class=\"skill-tag\"\u003e{t}\u003c/span\u003e\u0027 for t in proj[\"tech\"]])\n                st.markdown(tags_html, unsafe_allow_html=True)\n            with col2:\n                st.metric(\"성과\", proj[\"highlight\"])\n\n# ── 연락하기 ───────────────────────────────────────────\nelif menu == \"📬 연락하기\":\n    st.subheader(\"📬 연락하기\")\n\n    col1, col2 = st.columns(2)\n\n    with col1:\n        st.markdown(\"#### 메시지 보내기\")\n        with st.form(\"contact_form\"):\n            name = st.text_input(\"이름\")\n            email = st.text_input(\"이메일\")\n            subject = st.selectbox(\"문의 유형\", [\"협업 제안\", \"채용 문의\", \"기술 질문\", \"기타\"])\n            message = st.text_area(\"메시지\", height=150)\n            submitted = st.form_submit_button(\"전송하기\", type=\"primary\", use_container_width=True)\n            if submitted:\n                if name and email and message:\n                    st.success(f\"✅ {name}님, 메시지가 전송되었습니다! 빠른 시일 내에 답변드리겠습니다.\")\n                else:\n                    st.error(\"이름, 이메일, 메시지를 모두 입력해주세요.\")\n\n    with col2:\n        st.markdown(\"#### 연락처 정보\")\n        st.markdown(\"\"\"\n        | | |\n        |--|--|\n        | 📧 이메일 | zwnfkko@google.com |\n        | 📱 전화 | 010-1234-5678 |\n        | 🐱 GitHub | [github.com/zwnfkko](https://github.com/zwnfkko) |\n        | 💼 LinkedIn | linkedin.com/in/jiwon |\n        | 📍 위치 | 서울특별시 |\n        \"\"\")\n\n        st.markdown(\"#### 응답 가능 시간\")\n        st.info(\"⏰ 평일 오전 10시 ~ 오후 6시\\n\\n보통 24시간 이내 응답합니다.\")\n",
